name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GUI runtime dependency
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Install project and test runner
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest pytest-qt
      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      - name: Check patch whitespace
        run: git diff --check
