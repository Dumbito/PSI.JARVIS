[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psi-jarvis"
version = "0.1.0"
description = "Scientific Paper Screening & Analysis System"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "PSI.JARVIS Development Team" }
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
