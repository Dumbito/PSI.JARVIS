[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psi-jarvis"
version = "0.1.0"
description = "Scientific Paper Screening & Analysis System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pydantic-settings>=2.14.2",
    "PySide6>=6.8,<7",
]

authors = [
    { name = "PSI.JARVIS Development Team" }
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
psi = "psi_jarvis.cli:main"
psi-gui = "psi_jarvis.gui:main"
